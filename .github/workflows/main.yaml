name: Windows Cloud PC - Anydesk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Instalar AnyDesk
        shell: cmd
        run: choco install anydesk -y --ignore-checksums

      - name: Iniciar serviço e obter ID
        shell: cmd
        run: |
          echo Iniciando serviço AnyDesk...
          net start AnyDesk
          echo Aguardando 10 segundos...
          ping -n 11 127.0.0.1 >nul
          echo Obtendo ID...
          "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id > %TEMP%\id.txt 2>&1
          set /p ID=<%TEMP%\id.txt
          echo ID DO ANYDESK: %ID%

      - name: Manter Sessão Ativa
        shell: cmd
        run: |
          :keep_alive
          echo Keep alive - %date% %time%
          ping -n 61 127.0.0.1 >nul
          goto keep_alive
