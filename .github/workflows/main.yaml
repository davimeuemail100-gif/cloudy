name: Windows Cloud PC - Anydesk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10080  # 7 dias (público)

    steps:
      - name: Instalar AnyDesk
        shell: cmd
        run: choco install anydesk -y --ignore-checksums

      - name: Configurar acesso autônomo e obter ID
        shell: cmd
        run: |
          net start AnyDesk
          ping -n 11 127.0.0.1 >nul

          echo Criando arquivo de configuração para senha autônoma...
          mkdir "C:\ProgramData\AnyDesk" 2>nul
          echo password=Abacaxi2024 > "C:\ProgramData\AnyDesk\service.conf"

          echo Reiniciando serviço para aplicar configuração...
          net stop AnyDesk
          ping -n 5 127.0.0.1 >nul
          net start AnyDesk
          ping -n 10 127.0.0.1 >nul

          echo Obtendo ID...
          "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id > %TEMP%\id.txt 2>&1
          set /p ID=<%TEMP%\id.txt
          echo =========================================
          echo ID DO ANYDESK: %ID%
          echo SENHA AUTÔNOMA: Abacaxi2024
          echo =========================================

      - name: Manter Sessão Ativa
        shell: cmd
        run: |
          :keep_alive
          echo Keep alive - %date% %time%
          ping -n 61 127.0.0.1 >nul
          goto keep_alive
