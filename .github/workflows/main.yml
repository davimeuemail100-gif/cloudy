name: Windows Cloud PC - Anydesk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10080  # 7 dias (público)

    steps:
      - name: Instalar AnyDesk
        shell: pwsh
        run: choco install anydesk -y --ignore-checksums

      - name: Iniciar AnyDesk
        shell: pwsh
        run: Start-Process "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" -ArgumentList "--start-with-win --silent" -WindowStyle Hidden

      - name: Exibir ID do AnyDesk
        shell: pwsh
        run: |
          Start-Sleep -Seconds 10
          $id = & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
          Write-Host "ID DO ANYDESK: $id"
          echo "anydesk_id=$id" >> $env:GITHUB_OUTPUT

      - name: Manter Sessão Ativa
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "Keep alive - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
