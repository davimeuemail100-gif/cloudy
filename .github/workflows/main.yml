name: Windows Cloud PC - Anydesk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10080  # 7 dias (público)

    steps:
      - name: Instalar e Configurar AnyDesk como Serviço
        shell: cmd
        run: |
          choco install anydesk -y --ignore-checksums
          "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --install "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --start-with-win --silent
          net start AnyDesk || echo Serviço não iniciou, tentando forçar...
          sc config AnyDesk start= auto
          net start AnyDesk
          timeout /t 10 /nobreak >nul

      - name: Obter ID do AnyDesk
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set tentativas=0
          :loop
          set /a tentativas+=1
          echo Tentativa !tentativas! de obter ID...
          "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id > %TEMP%\anydesk_id.txt 2>&1
          type %TEMP%\anydesk_id.txt
          findstr /r "^[0-9]*$" %TEMP%\anydesk_id.txt >nul
          if %errorlevel% equ 0 (
            for /f %%i in (%TEMP%\anydesk_id.txt) do echo ID DO ANYDESK: %%i
            goto :continue
          )
          if !tentativas! lss 12 (
            timeout /t 10 /nobreak >nul
            goto :loop
          )
          echo ERRO: Não foi possível obter o ID após várias tentativas.
          echo Diagnóstico:
          tasklist | findstr AnyDesk
          sc query AnyDesk
          dir "C:\Program Files (x86)\AnyDesk"
          exit /b 1
          :continue

      - name: Manter Sessão Ativa
        shell: cmd
        run: |
          :keep_alive
          echo Keep alive - %date% %time%
          timeout /t 60 /nobreak >nul
          goto keep_alive
